<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - WebDesign & Coding Services</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="register-container">
        <div class="logo">YourLogo</div>
        <form id="registerForm">
            <h2>Create Account</h2>
            <div class="input-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" required>
            </div>
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" required>
            </div>
            <div class="input-group">
                <label for="password">Password (min 6 characters)</label>
                <input type="password" id="password" minlength="6" required>
            </div>
            <div class="input-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" minlength="6" required>
            </div>
            <div class="input-group">
                <label>Registering as:</label>
                <div class="radio-group">
                    <label>
                        <input type="radio" name="userType" value="client" checked> Client
                    </label>
                    <label>
                        <input type="radio" name="userType" value="seller"> Seller
                    </label>
                </div>
            </div>
            <button type="submit">Register</button>
            <div class="links">
                <a href="login.html">Already have an account? Login</a>
            </div>
        </form>
    </div>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
